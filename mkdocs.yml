site_name: Router IP Guide - Gateway & Hardware Diagnostics
site_description: Technical reference for DOCSIS 3.1 cable modems, fiber ONTs, and router gateway diagnostic interfaces.
site_author: Router IP Guide
site_url: https://router-gateway-guide.readthedocs.io/

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

nav:
  - 'Gateway Troubleshooting': index.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
